                    - text: "| KRW 138,399,000 | |"
                    - strong [ref=e804]: 마감
                    - text: "| 2026-06-18 (⚠️ D-7 이내 — 즉각 착수 필요) | |"
                    - strong [ref=e805]: 발주기관
                    - text: "| 국방부 국군재정관리단 |"
                  - paragraph [ref=e806]:
                    - strong [ref=e807]: 판단 근거 요약
                    - text: seed 자동 판단(fit 100 / urgency 90 / risk 15)과 HyperCloud 강점 분석이 일치한다. '실감형', 'XR' 직접 키워드가 공고 제목에 명시되어 있으며, 예산 규모와 콘텐츠 제작 용역 성격이 소규모팀 구조에 부합한다. 하드웨어 납품 요소는 현재 공고 요약 내 미확인으로 주의사항 저촉 위험 낮음. confidence를 100이 아닌 91로 제한한 이유는 requirements가 비어 있어 원문 미확인 상태이기 때문이다.
                  - separator [ref=e808]
                  - heading "1. 사업 이해" [level=2] [ref=e809]
                  - paragraph [ref=e810]:
                    - text: 국방부 국군재정관리단이 발주한 XR 기반 실감형 콘텐츠 제작 용역이다. 국방 분야에서 XR 실감 콘텐츠는 주로
                    - strong [ref=e811]: 교육·훈련 시뮬레이션, 장비 운용 가이드, 안전교육
                    - text: 등에 활용되며, 기존 텍스트·영상 기반 교육 대비 몰입도와 체감 효과를 높이는 것이 목적이다. 예산 약 1억 3,800만 원 규모는 단기 제작 프로젝트(3~6개월)에 해당하는 전형적인 용역 단가다.
                  - paragraph [ref=e812]:
                    - strong [ref=e813]: 확인이 필요한 사항
                  - list [ref=e814]:
                    - listitem [ref=e815]: 콘텐츠 주제(재정관리 업무 교육인지, 군 훈련인지)
