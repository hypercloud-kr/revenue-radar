                    - strong [ref=e825]: 빌드·납품
                    - text: "| 타겟 플랫폼 빌드, 테스트, 매뉴얼 | ✅ 주도 | |"
                    - strong [ref=e826]: 하드웨어 공급
                    - text: "| HMD 등 기기 납품 | ⚠️ 원문 확인 후 결정 |"
                  - separator [ref=e827]
                  - heading "3. 수행 적합성" [level=2] [ref=e828]
                  - heading "✅ 강점 연결" [level=3] [ref=e829]
