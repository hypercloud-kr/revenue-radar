                      - text: ": 국방 교육 도메인에서 몰입형 3D 시뮬레이션은 HyperCloud가 반복 납품한 경험 영역."
                    - listitem [ref=e835]:
                      - strong [ref=e836]: 빠른 프로토타입
                      - text: ": D-7 이내 마감 촉박 상황에서 빠른 초안 제시로 발주처 신뢰 확보 가능."
                    - listitem [ref=e837]:
